<!DOCTYPE html>
<html>

<head>
    <title>DevOps Cloud Project</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 DevOps Cloud Project v2</h1>

    <p>Cloud-Native Application</p>

    <p><b>Frontend:</b> Running</p>

    <p><b>Version:</b> 1.0</p>

    <button onclick="checkBackend()">
        Check Backend
    </button>

    <div id="result"></div>

</div>

<script>

async function checkBackend() {

    const result = document.getElementById("result");

    result.innerHTML = "Checking backend...";

    try {

        const response = await fetch("/api/health");
        
        const data = await response.json();

        result.innerHTML =
            "✅ Backend Status: " + data.status;

    } catch (error) {

        result.innerHTML =
            "❌ Backend connection failed";

    }
}

</script>

</body>

</html>
