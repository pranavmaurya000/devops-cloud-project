apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-cloud-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pranavmaurya000/devops-cloud-project.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true